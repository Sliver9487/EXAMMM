<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GEO CHALLENGE — 修正版（文化区填色 & 黄赤交角）</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://d3js.org/topojson.v3.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Arial,system-ui;}
  :root{--bg:#f0f4f8;--surface:#fff;--primary:#2563eb;--text:#0f172a;--border:#e2e8f0}
  body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;min-height:100vh}
  header{width:100%;padding:12px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;justify-content:center}
  .container{width:92%;max-width:820px;margin-top:18px;display:flex;flex-direction:column;gap:14px;padding-bottom:120px}
  .mode-selector{display:flex;gap:8px;justify-content:center}
  .mode-btn{padding:8px 14px;border-radius:14px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
  .mode-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  #globe-box{width:100%;height:520px;background:var(--surface);border-radius:18px;border:1px solid var(--border);position:relative;overflow:visible;cursor:grab}
  svg{width:100%;height:100%}
  .card{background:var(--surface);padding:16px;border-radius:12px;border:1px solid var(--border);text-align:center}
  #user-input{width:70%;padding:10px;border-radius:10px;border:1px solid var(--border);text-align:center}
  .footer{position:fixed;bottom:28px;width:92%;max-width:820px;display:flex;gap:10px}
  .btn{padding:12px;border-radius:12px;border:none;cursor:pointer;font-weight:700}
  .btn-main{background:var(--primary);color:white;flex:1}
  .btn-sub{background:var(--surface);border:1px solid var(--border);flex:1}
</style>
</head>
<body>

<header><div style="font-weight:900;color:var(--primary)">GEO CHALLENGE</div></header>

<div class="container">
  <div class="mode-selector">
    <button class="mode-btn active" onclick="setMode('continents', this)">大洲</button>
    <button class="mode-btn" onclick="setMode('oceans', this)">大洋</button>
    <button class="mode-btn" onclick="setMode('culture', this)">文化区</button>
  </div>

  <div id="globe-box"><svg id="globe-svg"></svg></div>

  <div class="card">
    <div id="question" style="font-weight:800;margin-bottom:10px">选择上方模式并点击开始练习</div>
    <input id="user-input" placeholder="输入名称后回车" style="display:none" />
    <div id="feedback" style="margin-top:10px;height:20px;font-weight:700"></div>
  </div>
</div>

<div class="footer">
  <button id="tilt-btn" class="btn btn-sub">📐 黄赤交角: 关</button>
  <button id="start-btn" class="btn btn-main">开始练习</button>
</div>

<script>
/* ========== 数据 ========== */
const dataPool = {
  continents: [
    {name:'亚洲', center:[100, 35]}, {name:'欧洲', center:[15, 50]},
    {name:'非洲', center:[20, 5]}, {name:'北美洲', center:[-100, 40]},
    {name:'南美洲', center:[-60, -15]}, {name:'大洋洲', center:[135, -25]},
    {name:'南极洲', center:[0, -85]}
  ],
  oceans: [
    {name:'太平洋', center:[-160, 0]}, {name:'大西洋', center:[-30, 10]},
    {name:'印度洋', center:[80, -15]}, {name:'北冰洋', center:[0, 80]},
    {name:'南冰洋', center:[0, -65]}
  ],
  culture: [
    { name: '西方文化区',
      coords: [[-170,10],[-100,10],[-70,15],[-50,35],[-10,35],[10,55],[-10,65],[-50,65],[-120,60],[-170,40]] },
    { name: '大洋洲文化区',
      coords: [[110,-45],[155,-45],[179.9,-20],[160,-5],[140,-10],[130,-25],[110,-45]] },
    { name: '东亚文化区',
      coords: [[95,15],[125,10],[140,25],[140,45],[120,50],[100,45],[95,30]] },
    { name: '东南亚文化区',
      coords: [[95,-10],[125,-10],[130,15],[110,20],[100,5]] },
    { name: '南亚文化区',
      coords: [[65,-5],[100,-5],[100,30],[65,30]] },
    { name: '西亚——北非文化区',
      coords: [[-20,15],[40,10],[60,30],[40,40],[10,40],[-10,30]] },
    { name: '撒哈拉以南非洲文化区',
      coords: [[-20,-35],[50,-35],[50,10],[20,20],[-10,10]] }
  ]
};

let currentMode = 'continents';
let activePool = [];
let currentItem = null;
let isTilting = false;
let rotation = [105, -20, 0];
let isInteracting = false;
let worldData = null;

const svg = d3.select("#globe-svg");
const projection = d3.geoOrthographic().scale(220).clipAngle(90);
const path = d3.geoPath().projection(projection);

/* ====== 修正：归一化多边形经度以避免跨日界导致反填色 ======
   原因：若多边形点跨越 -180/180，会被解释为包含“补集”，导致圈内无色、圈外被填色。
   做法：计算点经度的平均方向，然后把每个点的经度调整到与均值相近的区间（shift ±360）。
*/
function normalizeLonCoords(coords) {
  // coords: [[lon,lat],...]
  // 计算向量平均以获得“平均角度”（处理环绕边界）
  const radians = coords.map(c => c[0] * Math.PI / 180);
  let sx = 0, sy = 0;
  for (const r of radians) { sx += Math.cos(r); sy += Math.sin(r); }
  const meanAngle = Math.atan2(sy, sx) * 180 / Math.PI; // -180..180
  // 把每个 lon 调整到与 meanAngle 差距 < 180
  const normalized = coords.map(c => {
    let lon = c[0];
    while (lon - meanAngle > 180) lon -= 360;
    while (lon - meanAngle < -180) lon += 360;
    return [lon, c[1]];
  });
  // 确保首尾闭合（geoJSON 可不闭合，但我们闭合更保险）
  if (normalized.length > 0) {
    const first = normalized[0];
    const last = normalized[normalized.length - 1];
    if (first[0] !== last[0] || first[1] !== last[1]) normalized.push([first[0], first[1]]);
  }
  return normalized;
}

/* ====== 生成黄赤交角（球面大圆） ====== */
function tiltedGreatCircleGeo(tiltDeg = 23.5, points = 360) {
  const tilt = tiltDeg * Math.PI/180;
  const coords = [];
  for (let i=0;i<=points;i++){
    const theta = (i/points) * 2 * Math.PI;
    const x = Math.cos(theta);
    const y = Math.sin(theta);
    const yr = y * Math.cos(tilt);
    const zr = y * Math.sin(tilt);
    const lon = Math.atan2(yr, x) * 180/Math.PI;
    const lat = Math.asin(zr) * 180/Math.PI;
    coords.push([lon, lat]);
  }
  return { type: "LineString", coordinates: coords };
}

/* ====== axis Geo（经线从北极到南极），但仅在 tilt 开时显示（避免恒显虚线） ====== */
const axisGeo = { type: "LineString", coordinates: [[0,90],[0,-90]] };

/* ====== helper: 提示圈半径 ====== */
function hintRadiusForMode(mode) {
  if (mode === 'continents') return 12;
  if (mode === 'oceans') return 18;
  if (mode === 'culture') return 10; // 更小更精确
  return 12;
}

/* ====== render 层次：Sphere -> land -> graticule -> culture(polygons) -> highlight -> axis(tilt only) -> ecliptic ====== */
function render() {
  svg.selectAll("*").remove();
  const box = document.getElementById('globe-box');
  projection.translate([box.offsetWidth/2, box.offsetHeight/2]);

  // Sphere
  svg.append("path").datum({type:"Sphere"}).attr("class","sphere").attr("d", path)
    .attr("fill","var(--surface)").attr("stroke","var(--border)");

  // land
  if (worldData) {
    svg.append("path").datum(worldData).attr("class","land").attr("d", path)
      .attr("fill","var(--primary)").attr("opacity",0.12).attr("stroke","none");
  }

  // graticule
  svg.append("path").datum(d3.geoGraticule()()).attr("d", path)
    .attr("fill","none").attr("stroke","var(--text)").attr("opacity",0.06);

  // culture polygons: NORMALIZED then filled red (透明)
  svg.selectAll(".culture-region")
    .data(dataPool.culture)
    .enter()
    .append("path")
    .attr("class","culture-region")
    .attr("d", d => {
      const poly = normalizeLonCoords(d.coords.slice());
      return path({ type: "Polygon", coordinates: [poly] });
    })
    .attr("fill", "#ef4444")
    .attr("fill-opacity", currentMode==='culture' ? 0.28 : 0.18)
    .attr("stroke", "#8b1111")
    .attr("stroke-width", 1);

  // highlight current item
  if (currentItem) {
    if (currentMode === 'culture') {
      const match = dataPool.culture.find(c=>c.name===currentItem.name);
      if (match) {
        const poly = normalizeLonCoords(match.coords.slice());
        svg.append("path")
          .datum({ type: "Polygon", coordinates: [poly] })
          .attr("d", path)
          .attr("fill","rgba(239,68,68,0.48)")
          .attr("stroke","rgba(0,0,0,0.12)");
      }
    } else {
      const r = hintRadiusForMode(currentMode);
      const circ = d3.geoCircle().center(currentItem.center).radius(r)();
      svg.append("path").datum(circ).attr("d", path)
        .attr("fill","rgba(239,68,68,0.48");
    }
  }

  // axis: 只在 tilt 开时显示（并更淡）
  if (isTilting) {
    svg.append("path")
      .datum(axisGeo)
      .attr("d", path)
      .attr("fill","none")
      .attr("stroke","rgba(16,24,40,0.5)")
      .attr("stroke-width",1)
      .attr("stroke-dasharray","3,4")
      .attr("opacity",0.7);

    // 极点小点
    const northPole = d3.geoCircle().center([0,90]).radius(1.2)();
    const southPole = d3.geoCircle().center([0,-90]).radius(1.2)();
    svg.append("path").datum(northPole).attr("d", path).attr("fill","#111").attr("opacity",0.85);
    svg.append("path").datum(southPole).attr("d", path).attr("fill","#111").attr("opacity",0.85);
  }

  // ecliptic (黄道面) : 也只在 tilt 开时绘制
  if (isTilting) {
    const eclip = tiltedGreatCircleGeo(23.5, 720);
    svg.append("path").datum(eclip).attr("d", path)
      .attr("fill","none")
      .attr("stroke","orange")
      .attr("stroke-width",2)
      .attr("opacity",0.92);

    // 轻微半透明带（辅助）
    const ringCoords = eclip.coordinates.concat([eclip.coordinates[0]]);
    svg.append("path").datum({type:"Polygon", coordinates:[ringCoords]}).attr("d", path)
      .attr("fill","rgba(255,165,0,0.05)").attr("stroke","none");
  }
}

/* ====== draw 更新 projection.rotate 后刷新 path 的 d ====== */
function draw(){
  projection.rotate([rotation[0], rotation[1], rotation[2]]);
  svg.selectAll("path").attr("d", path);
}

/* ====== 拖拽旋转交互 ====== */
const drag = d3.drag()
  .on("start", () => { isInteracting = true; })
  .on("drag", (e) => {
    const k = 120 / projection.scale();
    rotation[0] += e.dx * k;
    rotation[1] -= e.dy * k;
    draw();
  })
  .on("end", () => { setTimeout(()=>isInteracting=false, 200); });

svg.call(drag);

/* ====== init: 载入地形并自动缓慢旋转 ====== */
async function init(){
  const res = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json");
  const topo = await res.json();
  worldData = topojson.feature(topo, topo.objects.land);

  const box = document.getElementById('globe-box');
  projection.translate([box.offsetWidth/2, box.offsetHeight/2]);

  render();
  draw();

  d3.timer(() => {
    if (!isInteracting && !currentItem) {
      rotation[0] += 0.12;
      draw();
    }
  });
}
init();

/* ====== 模式与题库（保留原有交互） ====== */
function setMode(mode, btn){
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activePool = [...dataPool[mode]];
  currentItem = null;
  document.getElementById('user-input').style.display = 'none';
  document.getElementById('question').textContent = '点击开始练习';
  render(); draw();
}

const startBtn = document.getElementById('start-btn');
const userInput = document.getElementById('user-input');
const feedback = document.getElementById('feedback');
const questionText = document.getElementById('question');

startBtn.onclick = () => {
  if (activePool.length === 0) activePool = [...dataPool[currentMode]];
  const idx = Math.floor(Math.random() * activePool.length);
  currentItem = activePool.splice(idx,1)[0];

  if (currentItem.center) {
    rotation = [-currentItem.center[0], -currentItem.center[1], 0];
  } else if (currentMode === 'culture') {
    const match = dataPool.culture.find(c=>c.name===currentItem.name);
    const coords = match.coords;
    const approx = coords[Math.floor(coords.length/2)];
    rotation = [-approx[0], -approx[1], 0];
  }

  questionText.textContent = "图中非红色区块代表的是？";
  userInput.style.display = 'inline-block';
  userInput.value = "";
  userInput.focus();
  feedback.textContent = "";
  startBtn.textContent = "跳过此题";
  render(); draw();
};

userInput.onkeydown = (e) => {
  if (e.key === 'Enter'){
    if (!currentItem) return;
    const ans = userInput.value.trim();
    if (ans === currentItem.name){
      feedback.innerHTML = "<span style='color:#10b981'>✅ 正确！</span>";
      setTimeout(()=> startBtn.click(), 900);
    } else {
      feedback.innerHTML = `<span style='color:#ef4444'>❌ 答案：${currentItem.name}</span>`;
    }
  }
};

/* ====== 黄赤交角开关：同时控制自转轴与黄道面显隐 ====== */
document.getElementById('tilt-btn').onclick = function(){
  isTilting = !isTilting;
  this.textContent = isTilting ? '📐 黄赤交角: 开' : '📐 黄赤交角: 关';
  render(); draw();
};

window.addEventListener('resize', ()=>{ render(); draw(); });

</script>
</body>
</html>
