<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>华文注释练习 - EXAMMM</title>
    <meta name="description" content="EXAMMM 是一个简约高效的华文注释练习工具，支持章节选择、随机练习、预览全部词条和导出讲义 PDF。">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="华文注释练习 - EXAMMM">
    <meta property="og:description" content="选择章节，快速复习华文课文注释，并可导出讲义 PDF。">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./img/icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f6f1e8">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <div>
                <div class="logo">EXAMMM</div>
                <p class="tagline">华文注释练习</p>
            </div>
            <div class="controls" aria-label="练习设置">
                <button class="mode-pill" type="button" id="mode-btn" aria-pressed="true">问答模式</button>
                <button class="switch-control" type="button" id="theme-switch" aria-label="切换深色模式" aria-pressed="false">
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <main class="container" id="selection-screen">
        <section class="search-wrapper" aria-label="章节搜索">
            <label class="visually-hidden" for="search-bar">搜索章节</label>
            <input type="search" class="search-input" id="search-bar" placeholder="搜索章节..." autocomplete="off">
            <p class="selection-hint" id="selection-hint" aria-live="polite">请先选择章节</p>
        </section>

        <section class="chapter-list" id="chapter-list">
            <div class="empty-state">章节加载中...</div>
        </section>

        <section class="footer-toolbar-integrated" id="selection-footer" aria-label="底部工具栏">
            <button class="expand-handle" type="button" id="footer-toggle" aria-expanded="false">
                <span class="handle-icon" aria-hidden="true"></span>
                <span id="footer-toggle-text">展开更多选项</span>
            </button>

            <div id="footer-options" class="footer-options-area">
                <div class="option-group" aria-label="显示内容">
                    <span class="option-label">显示内容</span>
                    <div class="segmented-control">
                        <label><input type="radio" name="viewType" value="word" checked><span>词语模式</span></label>
                        <label><input type="radio" name="viewType" value="sentence"><span>原句模式</span></label>
                    </div>
                </div>
                <button class="btn-secondary-integrated" type="button" id="show-all-btn" disabled>预览全部</button>
                <button class="btn-secondary-integrated success" type="button" id="export-pdf-btn" disabled>导出讲义 PDF</button>
            </div>

            <div class="footer-main-row">
                <button class="random-btn" type="button" id="random-btn" aria-pressed="false">
                    <span>随机练习</span>
                    <span class="switch small" id="random-switch" aria-hidden="true"></span>
                </button>
                <button class="btn-main" type="button" id="start-btn" disabled title="请先选择章节">开始练习 (0)</button>
            </div>
        </section>
    </main>

    <main class="container" id="training-screen" hidden>
        <div class="session-bar">
            <span class="status-chip" id="mode-status">问答模式 · 词语模式</span>
            <span class="status-chip" id="progress">0 / 0</span>
        </div>

        <section id="card-mode" class="practice-shell">
            <article class="card" id="training-card" tabindex="0" aria-live="polite">
                <div class="word" id="display-word">-</div>
                <div class="mean" id="display-mean"></div>
                <div id="input-area">
                    <label class="visually-hidden" for="user-input">输入含义</label>
                    <input type="text" id="user-input" placeholder="输入含义后按 Enter" autocomplete="off">
                </div>
            </article>
            <div class="footer-toolbar">
                <button class="icon-btn" type="button" id="prev-btn" aria-label="上一题">上一题</button>
                <button class="btn-main" type="button" id="action-btn">显示答案</button>
                <button class="icon-btn" type="button" id="exit-btn" aria-label="返回章节">返回章节</button>
            </div>
        </section>

        <section id="preview-mode" class="preview-shell" hidden>
            <div id="preview-list" class="preview-list"></div>
            <div class="footer-toolbar">
                <button class="btn-main" type="button" id="preview-back-btn">返回章节</button>
            </div>
        </section>
    </main>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
